dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()

        // Use Google's hosted Maven Central mirror first to avoid Maven Central 429 rate limits.
        maven {
            url 'https://maven-central.storage-download.googleapis.com/maven2/'
        }

        // Keep Maven Central as a fallback.
        mavenCentral()
    }
}

include ':app'
