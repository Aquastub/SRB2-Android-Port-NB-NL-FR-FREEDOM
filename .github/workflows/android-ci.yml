name: Android CI

on:
  push:
    branches:
      - port
  pull_request:
    branches:
      - port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch matching official SRB2 game assets
        run: python3 .github/scripts/fetch-srb2-assets.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'ndk;28.0.12433566'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs (full-assets and no-assets flavors)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            assembleGameFullDebug \
            assembleGameNoAssetsDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: srb2-android-debug-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
